# Production on a VPS. Instructions: DEPLOY.md (local file, not in the repository).
#
# Images are not built here: deploy.ps1 builds cubing-backend and cubing-web on the
# developer's computer and loads them on the server. Settings come from .env next
# to this file (see .env.example).
#
# Only web publishes ports, and only 80 and 443. Docker opens published ports
# past ufw, so nothing else may be published here.

name: cubing

# Logs: container output goes to the server's journald (logging: driver: journald).
# It survives container re-creation on every deploy and is capped by journald's
# size and age limits (DEPLOY.md). Reading: journalctl -t cubing-backend

services:
  web:
    image: cubing-web:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Use nginx/prod.conf.template (HTTPS) instead of the local HTTP config.
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-prod
      # Only these variables are substituted; nginx's own $host etc. stay as they are.
      NGINX_ENVSUBST_FILTER: DOMAIN
      DOMAIN: ${DOMAIN:?Set DOMAIN in the .env file}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # nginx reloads every 6 hours to pick up a certificate renewed by certbot.
    # The image's entrypoint (config from the template) runs inside, as usual.
    command:
      - /bin/sh
      - -c
      - (while :; do sleep 21600; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: cubing-web

  backend:
    image: cubing-backend:latest
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file}
      DATABASE_URL: sqlite:////app/instance/cubing.db
      # Meetup links and QR codes are built from it.
      SITE_URL: https://${DOMAIN:?Set DOMAIN in the .env file}
      # Fixed, not from .env: cookies over HTTPS only, always.
      SECURE_COOKIES: "1"
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-1}
      # Email confirmation letters through the domain mailbox (backend/app/mail.py).
      # Required: password recovery and email confirmation need it.
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in the .env file}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      # `flask backup-db` (deploy/backup.sh) deletes backups older than this.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      # ALLOW_SEED is deliberately absent: demo data never loads in production.
    volumes:
      # The database and its backups (instance/backups).
      - backend-data:/app/instance
    # Not published: reachable only by the web container at backend:5000.
    expose:
      - "5000"
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: cubing-backend

  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Checks twice a day; renews a certificate 30 days before it expires.
    # The first certificate is obtained by deploy/cert.sh.
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: cubing-certbot

volumes:
  backend-data:
  letsencrypt:
  certbot-www:
