server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы сборки с хешем в имени можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все остальные пути отдают index.html, маршрутизирует Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
        # Браузер загружает ресурсы только с нашего домена (правило «Внешние
        # ресурсы» в CLAUDE.md). wasm-unsafe-eval и blob: — для генератора
        # скрамблов cubing.js, unsafe-inline в стилях — для листа печати QR,
        # data: в шрифтах — мелкие подмножества, которые Vite встраивает в CSS.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'" always;
    }
}
