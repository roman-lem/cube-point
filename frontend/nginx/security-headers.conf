# Security headers. Included in every location of app.conf: add_header from the
# server block is not inherited by a location that has its own add_header.
#
# CSP: the browser loads resources only from our own domain (see "External
# resources" in CLAUDE.md). wasm-unsafe-eval and blob: are for the cubing.js
# scramble generator, unsafe-inline in styles is for the QR print sheet,
# data: in fonts is for small subsets that Vite inlines into CSS.
# frame-ancestors and X-Frame-Options: other sites cannot frame ours (clickjacking);
# our own print iframes are allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# Referer goes only to our own domain: Flask-WTF checks it on HTTPS (CSRF),
# and page addresses do not leak to other sites.
add_header Referrer-Policy "same-origin" always;
# HSTS: $hsts is set by the server config (map in prod.conf.template, empty in
# local.conf). nginx does not send a header with an empty value.
add_header Strict-Transport-Security $hsts always;
