# Access log format, http level: included at the top of local.conf and
# prod.conf.template, used by app.conf.
# Without the query string and Referer: links from letters and other addresses
# may carry tokens. $uri is not used: after try_files it is /index.html.
map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

log_format site '$remote_addr [$time_local] "$request_method $request_path $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent"';
