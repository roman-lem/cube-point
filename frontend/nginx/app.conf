# The site itself: static frontend files and the /api/ proxy.
# Included by local.conf and prod.conf.template, so both serve the same app.

root /usr/share/nginx/html;
index index.html;

# Slow meetup Wi-Fi: compress text files (index.html, JS, CSS, cubing.js wasm).
gzip on;
gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx appends the client address as the last entry. The backend trusts
    # exactly one proxy (ProxyFix) and takes that entry as the real IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Build files with a hash in the name can be cached for a long time.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA: all other paths serve index.html, Vue Router does the routing.
location / {
    try_files $uri $uri/ /index.html;
    # The browser loads resources only from our own domain (see "External
    # resources" in docs/ARCHITECTURE.md). wasm-unsafe-eval and blob: are for the
    # cubing.js scramble generator, unsafe-inline in styles is for the QR print sheet,
    # data: in fonts is for small subsets that Vite inlines into CSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'" always;
}
