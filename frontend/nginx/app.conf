# The site itself: static frontend files and the /api/ proxy.
# Included by local.conf and prod.conf.template, so both serve the same app.

root /usr/share/nginx/html;
index index.html;

# Slow meetup Wi-Fi: compress text files (index.html, JS, CSS, cubing.js wasm).
gzip on;
gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

# Access log without the query string and Referer: links from letters and other
# addresses may carry tokens. The format is in log-format.conf.
access_log /var/log/nginx/access.log site;

location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx appends the client address as the last entry. The backend trusts
    # exactly one proxy (ProxyFix) and takes that entry as the real IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
}

# Build files with a hash in the name can be cached for a long time.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

# SPA: all other paths serve index.html, Vue Router does the routing.
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
}
