# Local run (docker-compose.yml): HTTP only, any host name.

include /etc/nginx/snippets/log-format.conf;

# No HSTS over plain HTTP (security-headers.conf skips an empty header).
map $host $hsts {
    default "";
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/app.conf;
}
