top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-on-primary text-[20px]">timer</span></div><div class="flex flex-col"><span class="font-label-sm text-label-sm text-primary-container leading-none font-bold tracking-wider uppercase">Speedcube Club</span><h1 class="font-headline-sm text-headline-sm text-text-primary tracking-tight truncate max-w-[190px] leading-tight">Taymer</h1></div></div><div class="flex items-center gap-space-sm"><div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-surface-container-low"><span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span><span class="font-label-sm text-label-sm text-primary-container tracking-wider uppercase font-semibold">В эфире</span></div><button aria-label="Профиль участника" class="w-8 h-8 rounded-full bg-surface-container-high border border-border flex items-center justify-center text-text-primary hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-text-primary text-[18px]">account_circle</span></button></div></div></header><main class="flex-1 flex flex-col w-full bg-background pt-14 pb-20"><div class="flex flex-col w-full select-none" id="training-timer-container">
<!-- Top Control & Scramble Header -->
<div class="px-margin pt-space-xs pb-space-sm flex flex-col gap-space-sm">
<div class="bg-surface rounded-xl shadow-sm p-space-sm flex flex-col gap-space-sm">
<!-- Row 1: Back Action, Event Switcher Chip, Mode Label -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<button aria-label="Назад к дисциплинам" class="w-9 h-9 rounded-lg bg-surface-container-low flex items-center justify-center text-text-primary hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container text-text-primary transition-colors" id="event-select-chip" type="button">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-label-md text-label-md tracking-tight">3x3</span>
<span class="material-symbols-outlined text-[16px] text-text-secondary">arrow_drop_down</span>
</button>
</div>
<div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">school</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide uppercase">Тренировка</span>
</div>
</div>
<!-- Row 2: Scramble Formula Block -->
<div class="bg-background rounded-lg p-2.5 flex items-center justify-between gap-space-sm">
<div class="font-time-small text-time-small text-text-primary font-semibold tracking-wide leading-relaxed overflow-x-auto whitespace-normal select-text" id="scramble-text">
          R U2 R' U' F2 D B2 L2 U' R2 F2 U' R B' D2 F' R' U2 R'
        </div>
<button aria-label="Сгенерировать новый скрамбл" class="w-8 h-8 rounded-lg flex-shrink-0 bg-surface flex items-center justify-center text-text-secondary hover:text-text-primary active:rotate-180 transition-transform duration-300 shadow-sm" id="next-scramble-btn" type="button">
<span class="material-symbols-outlined text-[18px]">refresh</span>
</button>
</div>
<!-- Row 3: Inspection Switch and Input Mode Selector -->
<div class="flex items-center justify-between pt-0.5">
<!-- Inspection toggle -->
<label class="flex items-center gap-2 cursor-pointer py-1">
<input checked="" class="sr-only peer" id="inspection-toggle" type="checkbox"/>
<div class="w-9 h-5 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-surface peer-checked:bg-primary-container after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface after:rounded-full after:h-4 after:w-4 after:transition-all relative"></div>
<span class="font-label-sm text-label-sm text-text-secondary peer-checked:text-text-primary">Инспекция 15 с</span>
</label>
<!-- Segmented Switch -->
<div class="flex items-center p-0.5 rounded-lg bg-surface-container-low">
<button class="px-2.5 py-1 rounded-md bg-surface text-primary-container font-label-sm text-label-sm shadow-sm transition-all" id="mode-timer-btn" type="button">
            Таймер
          </button>
<button class="px-2.5 py-1 rounded-md text-text-secondary hover:text-text-primary font-label-sm text-label-sm transition-all" id="mode-manual-btn" type="button">
            Ручной
          </button>
</div>
</div>
</div>
</div>
<!-- Giant Touch Surface / Timer Zone -->
<div class="relative flex-1 min-h-[460px] flex flex-col justify-between items-center px-margin pt-10 pb-4 cursor-pointer transition-colors duration-150 active:bg-surface-container-low/50" id="touch-timer-zone">
<!-- Visual Holding State Indicator Rings (Soft ambient glow) -->
<div class="absolute inset-0 m-auto w-56 h-56 rounded-full bg-primary-fixed/0 pointer-events-none transition-all duration-300 transform scale-75" id="hold-pulse"></div>
<div class="w-full flex-1 flex flex-col items-center justify-center gap-3">
<!-- Main Digital Digits -->
<div class="flex flex-col items-center">
<div class="font-time-hero text-[68px] leading-[76px] sm:text-[80px] sm:leading-[88px] text-text-primary font-bold tracking-tight select-none tabular-nums drop-shadow-sm transition-colors duration-150" id="timer-display">
          0.00
        </div>
<!-- Touch Instruction Hint -->
<div class="flex items-center gap-1.5 mt-2 px-3 py-1 rounded-full bg-surface/80 backdrop-blur-sm shadow-sm text-text-secondary transition-all" id="timer-status-hint">
<span class="material-symbols-outlined text-[18px] text-primary-container" id="status-icon">touch_app</span>
<span class="font-label-sm text-label-sm font-semibold tracking-tight" id="status-label">Удерживайте экран, чтобы начать</span>
</div>
</div>
<!-- Previous Solve Quick Micro-stat -->
<div class="flex items-center gap-1.5 mt-2">
<span class="font-body-sm text-body-sm text-text-secondary">Последняя:</span>
<span class="font-time-small text-time-small font-semibold text-text-primary bg-surface-container-high px-2 py-0.5 rounded-md">11.37</span>
</div>
</div>
<!-- Bottom Action inside Touch Boundary: Ao5 Series Launcher -->
<div class="w-full flex flex-col items-center pt-4 z-10">
<button class="w-auto px-5 h-10 rounded-full bg-surface shadow-sm hover:bg-surface-container-low active:scale-95 text-text-primary flex items-center justify-center gap-2 transition-all" id="ao5-trigger-btn" type="button">
<span class="material-symbols-outlined text-[18px] text-primary-container">play_circle</span>
<span class="font-label-md text-label-md">Начать серию (ao5)</span>
</button>
</div>
</div>
</div>
<script>
(() => {
  const touchArea = document.getElementById('touch-timer-zone');
  const timerDisplay = document.getElementById('timer-display');
  const statusHint = document.getElementById('timer-status-hint');
  const statusLabel = document.getElementById('status-label');
  const statusIcon = document.getElementById('status-icon');
  const holdPulse = document.getElementById('hold-pulse');
  const scrambleText = document.getElementById('scramble-text');
  const nextScrambleBtn = document.getElementById('next-scramble-btn');
  const ao5Btn = document.getElementById('ao5-trigger-btn');
  const modeTimer = document.getElementById('mode-timer-btn');
  const modeManual = document.getElementById('mode-manual-btn');

  // Realistic sample scrambles for training
  const scrambles = [
    "R U2 R' U' F2 D B2 L2 U' R2 F2 U' R B' D2 F' R' U2 R'",
    "F' R2 D2 B2 L2 F2 U' B2 D' F2 U B' L' D2 B' R2 D' F2 U R",
    "U2 B2 L2 F' R2 U2 B' R2 B2 D2 F L' D2 B' U' B2 R F D2",
    "D2 R' B2 D2 R' F2 R2 F2 D2 U2 L B' D2 U B F' U2 L2 U' R'",
    "B2 U' R2 D' F2 L2 D2 L2 U' B2 D' L' U' B' D' R' F' D B2 R2"
  ];
  let scrambleIdx = 0;

  nextScrambleBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    scrambleIdx = (scrambleIdx + 1) % scrambles.length;
    scrambleText.textContent = scrambles[scrambleIdx];
  });

  // State machine: idle, holding, ready, running
  let state = 'idle';
  let holdTimer = null;
  let startTime = 0;
  let intervalId = null;

  function updateTimer() {
    const elapsed = (performance.now() - startTime) / 1000;
    timerDisplay.textContent = elapsed.toFixed(2);
  }

  function handleStartHold(e) {
    // Ignore clicks on inner actionable buttons
    if (e.target.closest('#ao5-trigger-btn') || e.target.closest('button') || e.target.closest('input')) {
      return;
    }

    if (state === 'running') {
      // Stop solve immediately
      clearInterval(intervalId);
      state = 'idle';
      timerDisplay.classList.remove('text-primary-container');
      timerDisplay.classList.add('text-text-primary');
      statusLabel.textContent = 'Удерживайте экран, чтобы начать';
      statusIcon.textContent = 'touch_app';
      statusIcon.classList.remove('text-personal-best');
      statusIcon.classList.add('text-primary-container');
      return;
    }

    if (state === 'idle') {
      state = 'holding';
      timerDisplay.classList.add('text-error');
      statusLabel.textContent = 'Приготовьтесь...';
      statusIcon.textContent = 'pan_tool';
      statusIcon.classList.remove('text-primary-container');
      statusIcon.classList.add('text-error');
      
      holdPulse.classList.remove('scale-75', 'bg-primary-fixed/0');
      holdPulse.classList.add('scale-110', 'bg-error-container/40');

      holdTimer = setTimeout(() => {
        if (state === 'holding') {
          state = 'ready';
          timerDisplay.classList.remove('text-error');
          timerDisplay.classList.add('text-personal-best');
          statusLabel.textContent = 'Отпустите для старта!';
          statusIcon.classList.remove('text-error');
          statusIcon.classList.add('text-personal-best');

          holdPulse.classList.remove('bg-error-container/40');
          holdPulse.classList.add('bg-personal-best/20');
        }
      }, 550);
    }
  }

  function handleReleaseHold(e) {
    if (state === 'holding') {
      clearTimeout(holdTimer);
      state = 'idle';
      timerDisplay.classList.remove('text-error');
      timerDisplay.textContent = '0.00';
      statusLabel.textContent = 'Удерживайте экран, чтобы начать';
      statusIcon.textContent = 'touch_app';
      statusIcon.classList.remove('text-error');
      statusIcon.classList.add('text-primary-container');
      
      holdPulse.className = 'absolute inset-0 m-auto w-56 h-56 rounded-full bg-primary-fixed/0 pointer-events-none transition-all duration-300 transform scale-75';
    } else if (state === 'ready') {
      state = 'running';
      timerDisplay.classList.remove('text-personal-best');
      timerDisplay.classList.add('text-primary-container');
      statusLabel.textContent = 'Касание остановит время';
      statusIcon.textContent = 'stop_circle';
      statusIcon.classList.remove('text-personal-best');
      statusIcon.classList.add('text-primary-container');

      holdPulse.className = 'absolute inset-0 m-auto w-56 h-56 rounded-full bg-primary-fixed/0 pointer-events-none transition-all duration-300 transform scale-75';

      startTime = performance.now();
      timerDisplay.textContent = '0.00';
      intervalId = setInterval(updateTimer, 25);
    }
  }

  touchArea.addEventListener('pointerdown', handleStartHold);
  window.addEventListener('pointerup', handleReleaseHold);
  window.addEventListener('pointercancel', handleReleaseHold);

  // Simple segmented toggle visual effect
  modeManual?.addEventListener('click', (e) => {
    e.stopPropagation();
    modeManual.classList.add('bg-surface', 'text-primary-container', 'shadow-sm');
    modeManual.classList.remove('text-text-secondary');
    modeTimer.classList.remove('bg-surface', 'text-primary-container', 'shadow-sm');
    modeTimer.classList.add('text-text-secondary');
  });

  modeTimer?.addEventListener('click', (e) => {
    e.stopPropagation();
    modeTimer.classList.add('bg-surface', 'text-primary-container', 'shadow-sm');
    modeTimer.classList.remove('text-text-secondary');
    modeManual.classList.remove('bg-surface', 'text-primary-container', 'shadow-sm');
    modeManual.classList.add('text-text-secondary');
  });

  ao5Btn?.addEventListener('click', (e) => {
    e.stopPropagation();
    ao5Btn.classList.add('bg-primary-container', 'text-on-primary');
    ao5Btn.classList.remove('bg-surface', 'text-text-primary');
    setTimeout(() => {
      ao5Btn.classList.remove('bg-primary-container', 'text-on-primary');
      ao5Btn.classList.add('bg-surface', 'text-text-primary');
    }, 400);
  });
})();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.04)]" data-active-classes="text-primary-container font-label-md"><div class="flex justify-around items-center h-16 px-space-xs"><a aria-current="page" class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 transition-colors flex-1 text-primary-container font-label-md" data-path="taymer" href="#"><span class="material-symbols-outlined text-[22px]">timer</span><span class="font-label-sm text-label-sm">Таймер</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-text-secondary hover:text-text-primary transition-colors flex-1" data-path="layv" href="#"><span class="material-symbols-outlined text-[22px]">leaderboard</span><span class="font-label-sm text-label-sm">Лайв</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-text-secondary hover:text-text-primary transition-colors flex-1" data-path="mitapy" href="#"><span class="material-symbols-outlined text-[22px]">event</span><span class="font-label-sm text-label-sm">Митапы</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-text-secondary hover:text-text-primary transition-colors flex-1" data-path="rekordy" href="#"><span class="material-symbols-outlined text-[22px]">emoji_events</span><span class="font-label-sm text-label-sm">Рекорды</span></a><a class="min-w-[44px] min-h-[44px] flex flex-col items-center justify-center gap-0.5 text-text-secondary hover:text-text-primary transition-colors flex-1" data-path="statistika" href="#"><span class="material-symbols-outlined text-[22px]">analytics</span><span class="font-label-sm text-label-sm">Статистика</span></a></div></nav></body></html>
