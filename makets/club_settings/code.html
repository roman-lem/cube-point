<script>
  // Highlight active tab according to strict constraints
  (function() {
    const navLinks = document.querySelectorAll('nav a[data-path]');
    navLinks.forEach(link => {
      if (link.getAttribute('data-path') === 'club') {
        link.classList.remove('text-text-secondary');
        link.classList.add('text-primary-container', 'font-medium');
      } else {
        link.classList.remove('text-primary-container', 'font-medium');
        link.classList.add('text-text-secondary');
      }
    });

    // Simple interaction state for Save button
    const saveBtn = document.getElementById('save-button');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Сохранено</span>';
        saveBtn.classList.remove('bg-primary-container');
        saveBtn.classList.add('bg-personal-best');
        setTimeout(() => {
          saveBtn.innerHTML = originalContent;
          saveBtn.classList.remove('bg-personal-best');
          saveBtn.classList.add('bg-primary-container');
        }, 1800);
      });
    }

    // Delete link interaction
    const container = document.getElementById('links-container');
    if (container) {
      container.addEventListener('click', function(e) {
        const delBtn = e.target.closest('button');
        if (delBtn) {
          const row = delBtn.closest('div.flex');
          if (row) {
            row.style.opacity = '0';
            row.style.transform = 'scale(0.95)';
            row.style.transition = 'all 0.2s ease-out';
            setTimeout(() => row.remove(), 200);
          }
        }
      });
    }
  })();
