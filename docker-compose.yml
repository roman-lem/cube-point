services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the .env file}
      DATABASE_URL: sqlite:////app/instance/cubing.db
      # Meetup links and QR codes are built from it.
      SITE_URL: ${SITE_URL:-http://localhost}
      # Cookies over HTTPS only (browsers make an exception for localhost).
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
      # 0 closes registration; login for existing accounts works.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-1}
      # Without MAIL_HOST letters are written to the container log.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - backend-data:/app/instance
    # Not published: reachable only by the web container at backend:5000.
    expose:
      - "5000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
